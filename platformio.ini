; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = apps
default_envs = prod

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    khoih-prog/ESP32TimerInterrupt @ ^2.3.0
    bblanchon/ArduinoJson @ ^7.4.1         # For parsing/generating JSON (needed later for REST)
    # Wifi & Web
    tzapu/WiFiManager @ ^2.0.17-beta        # For WiFi provisioning portal (Using beta for latest fixes)
    ESPAsyncWebServer                     # For web server (implicitly pulls in AsyncTCP)
    # OTA
    ayushsharma82/ElegantOTA @ ^3.1.7             # Use current ElegantOTA (includes async mode)
build_flags =
    -I common # Add common directory to include paths
    -DCORE_DEBUG_LEVEL=3 ; 0=None, 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Verbose
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0 ; Pin AsyncTCP to Core 0
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1 ; Force ElegantOTA Async mode
board_build.filesystem = littlefs         # Use LittleFS

# --- Build Environments ---

[env:signal-test]
# Only SignalEngine + SerialCLI + dependencies
build_src_filter = +<../lib/> +<signal_cli/> # Build only signal_cli app + libraries
build_flags =
    ${env.build_flags}
    -DBUILD_SIGNAL_TEST
lib_ignore =
    WiFiManager
    ESPAsyncWebServer
    ElegantOTA # Keep ElegantOTA ignored for signal-test
    # WebFacade (implicitly ignored via build flags)

[env:web-test]
# WebFacade + WifiMgr + Mock SignalEngine + dependencies
build_src_filter = +<../lib/> +<web_mock/>   # Build only web_mock app + libraries
build_flags =
    ${env.build_flags}
    -DBUILD_WEB_TEST
lib_ignore =
    ElegantOTA # Keep ElegantOTA ignored for web-test
    # SignalEngine (implicitly ignored via build flags)
    # SerialCLI (implicitly ignored via build flags)

[env:prod]
# Full stack: SignalEngine + WebFacade + SerialCLI + OTA + dependencies
build_src_filter = +<../lib/> +<production_fw/> # Build only production_fw app + libraries
build_flags =
    ${env.build_flags}
    -DBUILD_PROD
