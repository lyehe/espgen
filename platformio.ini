; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = apps
default_envs = prod

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-I common
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
board_build.filesystem = littlefs

[env:signal-test]
build_src_filter = +<../lib/> +<signal_cli/>
build_flags = 
	${env.build_flags}
	-DBUILD_SIGNAL_TEST
lib_ignore = 
	WiFiManager
	ESPAsyncWebServer
	ElegantOTA

[env:web-test]
build_src_filter = +<../lib/> +<web_mock/>
build_flags = 
	${env.build_flags}
	-DBUILD_WEB_TEST
lib_ignore = 
	ElegantOTA

[env:prod]
build_src_filter = +<../lib/> +<production_fw/>
lib_deps = 
	khoih-prog/ESP32TimerInterrupt @ ^2.3.0
	bblanchon/ArduinoJson @ ^7.4.1
	tzapu/WiFiManager @ ^2.0.17-beta
	ESP32Async/ESPAsyncWebServer @ ^3.6.0
	ESP32Async/AsyncTCP @ ^3.4.0
	ayushsharma82/ElegantOTA @ ^3.1.7
	lennarthennigs/Button2@ ^2.3.4
build_flags = 
	${env.build_flags}
	-DBUILD_PROD
	-D BUILD_WEB=1
	-D DEFAULT_OUTPUT_PIN=18
	-D DEFAULT_LEDC_CHANNEL=0
	-D SIGNAL_ENGINE_CMD_QUEUE_LEN=10
lib_ldf_mode = deep+

[common]
lib_deps_builtin = 
	SPIFFS
	FS
	ESPmDNS
	WiFi
	Update
	Preferences
lib_deps_external = 
	${env:prod.lib_deps}
