<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Trigger Control</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>ESP32 Trigger</h1>

    <div>WS Status: <span id="ws-status" style="font-weight: bold;">Initializing...</span></div>
    <hr>
    <div>Signal Status: <span id="status" style="font-weight: bold;">Unknown</span></div>
    <div>Frequency (Hz): <span id="freq-display">---</span></div>
    <div>Duty Cycle: <span id="duty-display">---</span></div>
    <div>Ticks Since Start: <span id="tick-display">---</span></div>
    <hr>

    <fieldset>
        <legend>Controls</legend>
        <div>
            <label for="freq-input">Frequency (Hz):</label>
            <input type="number" id="freq-input" name="frequency" min="1" max="100000" step="10" value="1000">
        </div>
        <div>
            <label for="duty-input">Duty Cycle (0.0-1.0):</label>
            <input type="number" id="duty-input" name="duty_cycle" min="0" max="1" step="0.01" value="0.5">
        </div>
        <button id="update-button">Update Settings</button>
        <button id="start-button">Start Signal</button>
        <button id="stop-button">Stop Signal</button>
    </fieldset>


    <script src="js/api.js"></script>
    <script src="js/ws.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
