<!DOCTYPE html>
<html>
<head>
    <title>CORS Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        label { display: inline-block; width: 120px; }
        input { margin-bottom: 10px; padding: 5px; }
        button { padding: 8px 15px; }
        #output { margin-top: 15px; border: 1px solid #ccc; padding: 10px; background-color: #f9f9f9; min-height: 50px; white-space: pre-wrap; font-family: monospace;}
    </style>
</head>
<body>

    <h1>ESP32 API CORS Test</h1>

    <p>Enter the IP address of your ESP32 device and click the button to test fetching its status.</p>

    <label for="espIp">ESP32 IP Address:</label>
    <input type="text" id="espIp" placeholder="e.g., 192.168.1.100">
    <br>
    <button onclick="fetchStatus()">Fetch /api/status</button>

    <h2>Output:</h2>
    <div id="output">Click the button to make a request...</div>

    <script>
        async function fetchStatus() {
            const ipAddress = document.getElementById('espIp').value.trim();
            const outputDiv = document.getElementById('output');

            if (!ipAddress) {
                outputDiv.textContent = 'Error: Please enter the ESP32 IP address.';
                outputDiv.style.color = 'red';
                return;
            }

            const url = `http://${ipAddress}/api/status`;
            outputDiv.textContent = `Attempting to fetch from: ${url}\n...`;
            outputDiv.style.color = 'black';

            console.log(`Attempting GET request to: ${url}`);

            try {
                // Add headers if your API requires them (e.g., Content-Type, even for GET sometimes)
                // For this basic status check, it might not be needed, but good practice if POSTing.
                const response = await fetch(url, {
                    method: 'GET',
                    // Example headers if needed:
                    // headers: {
                    //     'Content-Type': 'application/json',
                    //     'Accept': 'application/json'
                    // }
                });

                console.log('Response Status:', response.status);
                const data = await response.json(); // Attempt to parse JSON response

                console.log('Response Data:', data);
                outputDiv.textContent = `Success!\nStatus: ${response.status}\nData:\n${JSON.stringify(data, null, 2)}`;
                outputDiv.style.color = 'green';

            } catch (error) {
                console.error('Fetch Error:', error);
                outputDiv.textContent = `Error: Failed to fetch.\n${error}\n\nCheck the browser's developer console (F12) for more details, especially CORS errors.`;
                outputDiv.style.color = 'red';
            }
        }
    </script>

</body>
</html>
