<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Trigger Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>ESP32 Trigger</h1>

    <div class="status-box">
        <h2>Status</h2>
        <p>Connection: <span id="ws-status">Connecting...</span></p>
        <p>IP Address: <span id="ip-address">N/A</span></p>
        <p>WiFi Mode: <span id="wifi-mode">N/A</span></p>
        <p>Signal Running: <span id="signal-running">N/A</span></p>
    </div>

    <div class="control-box">
        <h2>Controls</h2>
        <label for="frequency">Frequency (Hz):</label>
        <input type="number" id="frequency" value="1000"><br>

        <label for="duty">Duty Cycle (0.0-1.0):</label>
        <input type="range" id="duty" min="0" max="1" step="0.01" value="0.5">
        <span id="duty-value">0.50</span><br>

        <button id="start-button">Start Signal</button>
        <button id="stop-button">Stop Signal</button>
        <button id="update-button">Update Duty</button> <!-- Or integrate into slider -->
    </div>

    <div class="log-box">
         <h2>Log</h2>
        <pre id="log-output"></pre>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ws.js"></script>
    <script src="app.js"></script>
</body>
</html>
